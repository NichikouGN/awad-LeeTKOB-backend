name: quality

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "pa3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Start PostgreSQL and Redis with migrations
        run: cp .env.example .env && bun run db:start
      - name: Outbox and BullMQ restart recovery test
        run: bun run test:queue:integration
      - name: Build isolated C++ judge image
        run: docker build -f Dockerfile.judge -t leetkob-cpp-sandbox:local .
      - name: Sandbox attack tests
        env:
          DOCKER_SANDBOX_TESTS: "1"
        run: bun test test/sandbox/docker-sandbox.test.ts
      - name: Accepted submission hard-rule integration
        env:
          HARD_RULE_INTEGRATION: "1"
          MODEL_OFF: "1"
        run: bun test test/hard-rule.integration.test.ts
      - name: Build and run model-off checker without network
        run: |
          docker build -f Dockerfile.checker -t leetkob-checker:local .
          mkdir -p checker-output
          docker run --rm --network none --memory 512m --pids-limit 64 \
            --user "$(id -u):$(id -g)" -e MODEL_OFF=1 \
            --mount type=bind,src="$PWD/test/fixtures/hard-rule-dev",dst=/data,readonly \
            --mount type=bind,src="$PWD/checker-output",dst=/output \
            leetkob-checker:local /data /output/predictions.jsonl
          test "$(wc -l < checker-output/predictions.jsonl)" -eq 10
